<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>관리자 · 세법 쟁점 검토실</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
<header>
  <div><h1>관리자</h1><p>세법 쟁점 검토실의 상태, 사용 현황, 근거 자료를 관리합니다.</p></div>
  <nav aria-label="관리 메뉴" id="menu" hidden>
    <a href="#status" data-v="status">상태 점검</a>
    <a href="#stats" data-v="stats">사용 현황</a>
    <a href="#library" data-v="library">근거 자료</a>
    <a href="/">사이트로</a>
  </nav>
</header>

<form class="panel adm-login" id="login">
  <h2>관리자 로그인</h2>
  <label for="code">관리자 코드</label>
  <input id="code" type="password" autocomplete="current-password" required>
  <div class="actions"><button class="primary" type="submit">들어가기</button></div>
  <p class="status" id="login-status" role="status"></p>
</form>

<div id="app" hidden>
  <section id="v-status" class="panel adm-section">
    <div class="res-head"><h2>상태 점검</h2><button type="button" id="recheck">다시 점검</button></div>
    <p class="status" id="status-msg" role="status"></p>
    <div id="checks"></div>
  </section>

  <section id="v-stats" class="panel adm-section" hidden>
    <h2>사용 현황</h2>
    <p class="hint">최근 30일 기준이며 날짜는 한국 시간입니다. 횟수와 토큰 수만 기록하고 입력 내용은 저장하지 않습니다.</p>
    <p class="status" id="stats-msg" role="status"></p>
    <div id="stats"></div>
  </section>

  <section id="v-library" class="adm-section" hidden>
    <form class="panel" id="item-form">
      <h2 id="form-title">근거 자료 추가</h2>
      <p class="hint">등록한 자료는 다음 검토부터 확인된 근거로 Claude에 전달됩니다. 반드시 원문을 읽고 번호, 날짜, 요지를 확인한 뒤 등록하세요.</p>
      <div class="row">
        <div><label for="i-k">종류</label><select id="i-k"><option value="law">세법</option><option value="rul">유권해석</option><option value="trb">심판례</option><option value="crt">판례</option></select></div>
        <div><label for="i-no">번호</label><input id="i-no" maxlength="100" required></div>
      </div>
      <label for="i-title">제목</label><input id="i-title" maxlength="200" required>
      <div class="row">
        <div><label for="i-date">날짜</label><input id="i-date" maxlength="60" required></div>
        <div><label for="i-result">결과 (선택)</label><input id="i-result" maxlength="60"></div>
      </div>
      <label for="i-sum">요지</label><textarea id="i-sum" class="adm-sum" maxlength="5000" required></textarea>
      <label for="i-note">유의 사항 (선택)</label><input id="i-note" maxlength="1000">
      <label for="i-tags">쟁점 태그 (선택, 쉼표로 구분)</label><input id="i-tags">
      <div class="row">
        <div><label for="i-src">출처 이름</label><input id="i-src" maxlength="60" required></div>
        <div><label for="i-url">출처 주소 (https)</label><input id="i-url" type="url" maxlength="500" required></div>
      </div>
      <label for="i-off">국세법령정보시스템 주소 (선택)</label><input id="i-off" type="url" maxlength="500">
      <div class="actions">
        <button class="primary" id="save" type="submit">저장</button>
        <button id="cancel" type="button" hidden>수정 취소</button>
      </div>
      <p class="status" id="form-msg" role="status"></p>
    </form>
    <div class="panel adm-list">
      <h2>자료 목록</h2>
      <label for="find">검색</label><input id="find" autocomplete="off">
      <p class="status" id="list-msg" role="status"></p>
      <div id="items"></div>
    </div>
  </section>
</div>
</div>
<script src="/admin.js"></script>
</body>
</html>
